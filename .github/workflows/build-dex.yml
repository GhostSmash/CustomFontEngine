name: Build FontEngine DEX

# Запускается вручную (Actions -> Build FontEngine DEX -> Run workflow)
# либо автоматически при пуше тега вида v1.0, v1.1 и т.п.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install build-tools and platform (for android.jar)
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Compile Java sources to .class
        run: |
          mkdir -p out/classes
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d out/classes \
            $(find src -name "*.java")

      - name: Convert .class to .dex with d8
        run: |
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          mkdir -p out/dex
          find out/classes -name "*.class" > out/class_files.txt
          "$D8" --output out/dex @out/class_files.txt

      - name: Rename output
        run: |
          cp out/dex/classes.dex out/dex/FontEngine.dex

      - name: Upload build artifact (always, even without a tag)
        uses: actions/upload-artifact@v4
        with:
          name: FontEngine-dex
          path: out/dex/FontEngine.dex

      - name: Create GitHub Release with .dex asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/dex/FontEngine.dex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
